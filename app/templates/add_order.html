{% extends 'layout.html' %}

{% block content %}
<div class="orders-page">
    <section class="orders-topbar">
        <div>
            <p class="orders-eyebrow">Nuevo pedido</p>
            <h1>Crear Pedido</h1>
        </div>
        <div class="orders-actions">
            <a href="{{ url_for('orders') }}" class="orders-ghost">Volver al historial</a>
        </div>
    </section>

    <form method="POST" id="orderForm" class="orders-workspace">
        <aside class="orders-panel orders-current-panel">
            <div class="orders-panel-header">
                <div>
                    <p class="orders-eyebrow">Resumen</p>
                    <h2>Pedido actual</h2>
                </div>
            </div>
            <div class="orders-current-body">
                <label>
                    <span>Fecha del pedido</span>
                    <input type="date" id="order_date" name="order_date" value="{{ today_date }}" required>
                </label>

                <div class="orders-total-box">
                    <span>Total del Pedido</span>
                    <strong id="total-order-price">$0.00</strong>
                    <input type="hidden" name="total_order_price" id="hidden-total-order-price">
                </div>

                <button type="submit" class="orders-button orders-save-button">
                    Guardar Pedido
                </button>
                <a href="{{ url_for('orders') }}" class="orders-ghost orders-cancel-link">Cancelar</a>
            </div>
        </aside>

        <section class="orders-panel orders-catalog-panel">
            <div class="orders-panel-header">
                <div>
                    <p class="orders-eyebrow">Productos</p>
                    <h2>Items del pedido</h2>
                </div>
                <button type="button" id="add-item-btn" class="orders-button">
                    + Añadir Producto
                </button>
            </div>

            <div id="order-items-container" class="orders-items-container">
                <!-- Los items del pedido se añadiran aqui con JavaScript -->
            </div>
        </section>
    </form>
</div>

{% endblock %}
